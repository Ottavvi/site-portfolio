<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar conta | Otávio</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Space+Grotesk:wght@500..700&display=swap"
    />
    <link rel="stylesheet" href="css/style.css?v=5" />
    <!-- Aplica o tema salvo (ou o do sistema) antes de desenhar a página, para não piscar -->
    <script>
      try {
        const tema =
          localStorage.getItem('tema') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = tema;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="wrap nav">
          <!-- prettier-ignore -->
          <a class="logo" href="index.html#inicio" aria-label="Otávio, início">ottavvi<span>.</span>dev</a>
          <button class="theme-btn" id="themeBtn" type="button" aria-label="Mudar tema">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navLinks">Menu ☰</button>
          <nav class="links" id="navLinks" aria-label="Navegação principal">
            <a href="index.html#projetos">Projetos</a>
            <a href="index.html#habilidades">Habilidades</a>
            <a href="sobre.html">Sobre mim</a>
            <a href="index.html#contato">Contato</a>
            <a href="login.html" id="authLink">Entrar</a>
          </nav>
        </div>
      </header>
      <main>
        <section class="auth-page">
          <div class="wrap">
            <div class="auth-card">
              <div class="section-kicker">Área de membros</div>
              <h1>Criar conta</h1>
              <form class="auth-form" id="signupForm">
                <label>
                  Nome
                  <input type="text" name="nome" required autocomplete="name" />
                </label>
                <label>
                  E-mail
                  <input
                    type="email"
                    name="email"
                    required
                    autocomplete="email"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                  />
                </label>
                <label>
                  Senha
                  <span class="password-field">
                    <input
                      type="password"
                      name="senha"
                      required
                      minlength="6"
                      autocomplete="new-password"
                      autocapitalize="off"
                      autocorrect="off"
                      spellcheck="false"
                    />
                    <button class="toggle-password" type="button" aria-label="Mostrar senha" aria-pressed="false">
                      <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                        <circle cx="12" cy="12" r="3" />
                      </svg>
                      <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
                        <path
                          d="M17.9 17.9A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5.1-5.9M9.9 5.2A9 9 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"
                        />
                      </svg>
                    </button>
                  </span>
                </label>
                <label>
                  Confirmar senha
                  <span class="password-field">
                    <input
                      type="password"
                      name="confirmar"
                      required
                      minlength="6"
                      autocomplete="new-password"
                      autocapitalize="off"
                      autocorrect="off"
                      spellcheck="false"
                    />
                    <button class="toggle-password" type="button" aria-label="Mostrar senha" aria-pressed="false">
                      <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                        <circle cx="12" cy="12" r="3" />
                      </svg>
                      <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
                        <path
                          d="M17.9 17.9A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5.1-5.9M9.9 5.2A9 9 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"
                        />
                      </svg>
                    </button>
                  </span>
                </label>
                <button class="btn btn-primary" type="submit">Criar conta</button>
                <p class="notice" id="authNotice" role="status"></p>
              </form>
              <p class="auth-alt">
                Já tem conta?
                <a href="login.html">Entrar</a>
              </p>
            </div>
          </div>
        </section>
      </main>
      <footer>
        <div class="wrap foot">
          <span>
            ©
            <span id="year"></span>
            Otávio. Feito com HTML, CSS e JavaScript.
          </span>
          <div class="small-links">
            <a href="https://github.com/Ottavvi" target="_blank" rel="noreferrer">GitHub ↗</a>
            <a href="index.html">Página inicial</a>
          </div>
        </div>
      </footer>
    </div>
    <script src="js/main.js"></script>
    <script type="module" src="js/auth/session.js"></script>
    <script type="module" src="js/auth/cadastro.js"></script>
  </body>
</html>
