<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada | Otávio</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#08141a" />
    <!-- O GitHub Pages mostra esta página em qualquer endereço inexistente, por isso os caminhos são absolutos -->
    <link rel="icon" href="/site-portfolio/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/site-portfolio/fontes/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/site-portfolio/fontes/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/site-portfolio/css/style.css?v=10" />
    <!-- Aplica o tema salvo (ou o do sistema) antes de desenhar a página, para não piscar -->
    <script>
      try {
        const tema =
          localStorage.getItem('tema') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = tema;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="wrap nav">
          <!-- prettier-ignore -->
          <a class="logo" href="/site-portfolio/" aria-label="Otávio, início">ottavvi<span>.</span>dev</a>
          <button class="theme-btn" id="themeBtn" type="button" aria-label="Mudar tema">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navLinks">Menu ☰</button>
          <nav class="links" id="navLinks" aria-label="Navegação principal">
            <a href="/site-portfolio/#projetos">Projetos</a>
            <a href="/site-portfolio/sobre.html">Sobre mim</a>
            <a href="/site-portfolio/#contato">Contato</a>
            <a href="/site-portfolio/en/" lang="en" hreflang="en" class="lang-link">EN</a>
          </nav>
        </div>
      </header>
      <main>
        <section class="hero not-found" id="inicio">
          <div class="wrap">
            <p class="not-found-code" aria-hidden="true">404</p>
            <h1>Página não encontrada.</h1>
            <p class="lead">O endereço pode ter mudado ou sido digitado errado. Os projetos continuam todos aqui.</p>
            <div class="actions">
              <a class="btn btn-primary" href="/site-portfolio/">Ir para o início ↗</a>
              <a class="btn btn-ghost" href="/site-portfolio/#projetos">Ver os projetos ↘</a>
            </div>
            <p class="stack" lang="en">
              <strong>Page not found.</strong>
              <a class="text-link" href="/site-portfolio/en/">Go to the English home page →</a>
            </p>
          </div>
        </section>
      </main>
      <footer>
        <div class="wrap foot">
          <span>
            ©
            <span id="year"></span>
            Otávio. Feito com HTML, CSS e JavaScript.
          </span>
          <div class="small-links">
            <a href="https://github.com/Ottavvi" target="_blank" rel="noreferrer">GitHub ↗</a>
          </div>
        </div>
      </footer>
    </div>
    <script src="/site-portfolio/js/main.js" defer></script>
    <script src="/site-portfolio/js/paleta.js" defer></script>
  </body>
</html>
