<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painel de admin | Otávio</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fontes/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fontes/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/style.css?v=11" />
    <!-- Aplica o tema salvo (ou o do sistema) antes de desenhar a página, para não piscar -->
    <script>
      try {
        const tema =
          localStorage.getItem('tema') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = tema;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="wrap nav">
          <!-- prettier-ignore -->
          <a class="logo" href="index.html#inicio" aria-label="Otávio, início">ottavvi<span>.</span>dev</a>
          <button class="theme-btn" id="themeBtn" type="button" aria-label="Mudar tema">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navLinks">Menu ☰</button>
          <nav class="links" id="navLinks" aria-label="Navegação principal">
            <a href="index.html#projetos">Projetos</a>
            <a href="index.html#habilidades">Habilidades</a>
            <a href="estudos/">Estudos</a>
            <a href="sobre.html">Sobre mim</a>
            <a href="index.html#contato">Contato</a>
            <a href="area.html">Minha área</a>
          </nav>
        </div>
      </header>
      <main>
        <section id="adminArea" hidden>
          <div class="wrap">
            <div class="section-kicker">Painel de admin</div>
            <h2>
              Usuários cadastrados:
              <span id="usersCount">…</span>
            </h2>
            <p class="notice" id="authNotice" role="status"></p>
            <div class="table-wrap">
              <table class="users-table">
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Cadastro</th>
                    <th>E-mail confirmado</th>
                  </tr>
                </thead>
                <tbody id="usersTable">
                  <tr>
                    <td colspan="4">Carregando...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <h2 class="admin-subtitle">
              Mensagens de contato:
              <span id="messagesCount">…</span>
            </h2>
            <div class="messages" id="messagesList">Carregando...</div>
            <div class="actions">
              <a class="btn btn-ghost" href="area.html">← Minha área</a>
              <button class="btn btn-ghost" type="button" id="logoutBtn">Sair da conta</button>
            </div>
          </div>
        </section>
      </main>
      <footer>
        <div class="wrap foot">
          <span>
            ©
            <span id="year"></span>
            Otávio. Feito com HTML, CSS e JavaScript.
          </span>
          <div class="small-links">
            <a href="https://github.com/Ottavvi" target="_blank" rel="noreferrer">GitHub ↗</a>
            <a href="index.html">Página inicial</a>
          </div>
        </div>
      </footer>
    </div>
    <script src="js/main.js" defer></script>
    <script src="js/paleta.js" defer></script>
    <script type="module" src="js/auth/session.js"></script>
    <script type="module" src="js/auth/admin.js"></script>
  </body>
</html>
