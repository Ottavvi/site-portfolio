<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar | Otávio</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="wrap nav">
          <!-- prettier-ignore -->
          <a class="logo" href="index.html#inicio" aria-label="Otávio, início">ottavvi<span>.</span>dev</a>
          <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navLinks">Menu ☰</button>
          <nav class="links" id="navLinks" aria-label="Navegação principal">
            <a href="index.html#projetos">Projetos</a>
            <a href="index.html#habilidades">Habilidades</a>
            <a href="sobre.html">Sobre mim</a>
            <a href="index.html#contato">Contato</a>
            <a href="login.html" id="authLink" aria-current="page">Entrar</a>
          </nav>
        </div>
      </header>
      <main>
        <section class="auth-page">
          <div class="wrap">
            <div class="auth-card">
              <div class="section-kicker">Área de membros</div>
              <h1>Entrar</h1>
              <form class="auth-form" id="loginForm">
                <label>
                  E-mail
                  <input
                    type="email"
                    name="email"
                    required
                    autocomplete="email"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                  />
                </label>
                <label>
                  Senha
                  <span class="password-field">
                    <input
                      type="password"
                      name="senha"
                      required
                      autocomplete="current-password"
                      autocapitalize="off"
                      autocorrect="off"
                      spellcheck="false"
                    />
                    <button class="toggle-password" type="button" aria-label="Mostrar senha" aria-pressed="false">
                      <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                        <circle cx="12" cy="12" r="3" />
                      </svg>
                      <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
                        <path
                          d="M17.9 17.9A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5.1-5.9M9.9 5.2A9 9 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"
                        />
                      </svg>
                    </button>
                  </span>
                </label>
                <a class="forgot-link" href="recuperar.html" id="resetLink">Esqueci minha senha</a>
                <button class="btn btn-primary" type="submit">Entrar</button>
                <p class="notice" id="authNotice" role="status"></p>
              </form>
              <p class="auth-alt">
                Ainda não tem conta?
                <a href="cadastro.html">Criar conta</a>
              </p>
            </div>
          </div>
        </section>
      </main>
      <footer>
        <div class="wrap foot">
          <span>
            ©
            <span id="year"></span>
            Otávio. Feito com HTML, CSS e JavaScript.
          </span>
          <div class="small-links">
            <a href="https://github.com/Ottavvi" target="_blank" rel="noreferrer">GitHub ↗</a>
            <a href="index.html">Página inicial</a>
          </div>
        </div>
      </footer>
    </div>
    <script src="js/main.js"></script>
    <script type="module" src="js/auth/session.js"></script>
    <script type="module" src="js/auth/login.js"></script>
  </body>
</html>
